name: Daily external data update

on:
  schedule:
    # GitHub cron is UTC and scheduled jobs can be delayed. Running at both
    # 15:00 and 16:00 UTC covers daylight saving; the script skips duplicates.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public Ghana market, research, and news sources
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/update_external_data.py --skip-if-updated-today
          else
            python scripts/update_external_data.py
          fi

      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh external Ghana market data"
          file_pattern: data/external-sources.json
